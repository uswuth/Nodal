<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DNS Switcher</title>
  <defs>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3BA0F2"/>
      <stop offset="100%" stop-color="#0F6CBD"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F6CBD" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- two nodes -->
    <circle cx="170" cy="256" r="66" fill="url(#nodeGrad)"/>
    <circle cx="342" cy="256" r="66" fill="url(#nodeGrad)"/>

    <!-- switch arrows, node A to node B and back -->
    <path d="M 208 200 Q 256 148 304 200" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    <path d="M 304 312 Q 256 364 208 312" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>

    <!-- arrowheads -->
    <path d="M 294 188 L 312 200 L 294 212 Z" fill="#FFFFFF"/>
    <path d="M 218 324 L 200 312 L 218 300 Z" fill="#FFFFFF"/>
  </g>
</svg>

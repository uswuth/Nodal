#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/Nodal.exe"
  cmd = "go build -ldflags=\"-H windowsgui -s -w\" -o ./tmp/Nodal.exe ./cmd/nodal"
  delay = 500
  exclude_dir = ["tmp", "docs", "vendor", "testdata", ".git", ".agents"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "toml"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

  [build.windows]
    bin = "tmp\\Nodal.exe"
    cmd = "go build -ldflags=\"-H windowsgui -s -w\" -o ./tmp/Nodal.exe ./cmd/nodal"
    pre_cmd = ["Stop-Process -Name Nodal -Force -ErrorAction SilentlyContinue; Remove-Item -Path .\\tmp\\Nodal.exe -Force -ErrorAction SilentlyContinue; exit 0"]

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
